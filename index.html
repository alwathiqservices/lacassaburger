<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>لاكاسا برجر | LaCasa Burger</title>
<meta name="description" content="لاكاسا برجر - الفلوجة، شارع الثرثار. تصفّح المنيو وتابعنا على مواقع التواصل الاجتماعي.">
<meta name="theme-color" content="#1a0000">

<link rel="manifest" href="/lacassaburger/manifest.webmanifest">
<link rel="icon" href="/lacassaburger/assets/icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/lacassaburger/assets/icons/apple-touch-icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="لاكاسا برجر">
<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="page">

  <div class="scene-glow" aria-hidden="true"></div>
  <div class="vault-emblem" aria-hidden="true"></div>

  <div class="container" id="mainContent">

    <div class="logo-badge reveal r1">
      <img src="assets/images/logo.png" alt="شعار لاكاسا برجر" width="96" height="96">
    </div>

    <p class="brand-kicker reveal r2">LACASA BURGER</p>
    <h1 class="brand-title reveal r3">لاكاسا <span>برجر</span></h1>
    <p class="tagline reveal r4">خطّة محكمة… لطعم لا يُقاوم</p>

    <div class="scene-card reveal r5">
      <div class="scene-vignette"></div>
      <img src="assets/images/burger-hero.png" alt="برجر لاكاسا الشهي" class="scene-img" width="640" height="620" loading="eager">
      <div class="scene-shine"></div>
    </div>

    <a class="menu-btn reveal r6" id="menuBtn" href="https://alwathiqservices.github.io/lacasanew/">
      <i class="fa-solid fa-utensils" aria-hidden="true"></i>
      <span>تصفّح المنيو</span>
      <i class="fa-solid fa-arrow-left menu-btn-arrow" aria-hidden="true"></i>
    </a>
    <p class="menu-caption reveal r6">اختار وجبتك المفضّلة</p>

    <p class="location reveal r7">
      <i class="fa-solid fa-location-dot" aria-hidden="true"></i>
      الفلوجة — شارع الثرثار
    </p>

    <button class="install-btn reveal r7" id="installBtn" type="button" hidden>
      <i class="fa-solid fa-arrow-down-to-line" aria-hidden="true"></i>
      أضف للشاشة الرئيسية
    </button>

    <h2 class="social-title reveal r7">تابع أجواء لاكاسا</h2>
    <div class="social-row reveal r7">
      <a class="social-btn ig" href="https://www.instagram.com/lacasa_burger1" target="_blank" rel="noopener" aria-label="إنستغرام">
        <i class="fa-brands fa-instagram" aria-hidden="true"></i>
      </a>
      <a class="social-btn tt" href="https://www.tiktok.com/@lacasa_burger1" target="_blank" rel="noopener" aria-label="تيك توك">
        <i class="fa-brands fa-tiktok" aria-hidden="true"></i>
      </a>
      <a class="social-btn fb" href="https://www.facebook.com/share/18UTYxck98/?mibextid=wwXIfr" target="_blank" rel="noopener" aria-label="فيسبوك">
        <i class="fa-brands fa-facebook-f" aria-hidden="true"></i>
      </a>
    </div>

    <div class="footer">
      © <a href="https://www.instagram.com/alwathiqservices" target="_blank" rel="noopener"><span>Alwathiq</span>Services</a>
    </div>

  </div>
</main>

<!-- إرشاد التثبيت على iPhone (يظهر فقط عند الضغط على زر "أضف للشاشة الرئيسية" على iOS) -->
<div class="ios-sheet-overlay" id="iosSheetOverlay"></div>
<div class="ios-sheet" id="iosSheet" role="dialog" aria-modal="true" aria-labelledby="iosSheetTitle">
  <div class="ios-sheet-handle"></div>
  <h3 id="iosSheetTitle">إضافة إلى الشاشة الرئيسية</h3>
  <ol>
    <li>افتح الصفحة عبر متصفح <strong>Safari</strong>.</li>
    <li>اضغط زر <strong>المشاركة</strong> <i class="fa-solid fa-arrow-up-from-bracket"></i> بالأسفل.</li>
    <li>اختر <strong>"إضافة إلى الشاشة الرئيسية"</strong>.</li>
  </ol>
  <button class="ios-sheet-close" id="iosSheetClose" type="button">حسناً</button>
</div>

<div class="toast" id="toast"></div>

<script src="script.js"></script>
</body>
</html>
